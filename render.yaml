services:
  - type: web
    name: rahgir
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Rahgir
      - key: APP_ENV
        value: production
      - key: ALLOW_DEMO
        value: "true"
      - key: ROUTING_PROVIDER
        value: osrm
      - key: GEOCODER_PROVIDER
        value: nominatim
      - key: HTTP_USER_AGENT
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/rahgir.db
