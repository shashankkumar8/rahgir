<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared Rahgir itinerary</title><link rel="stylesheet" href="/static/styles.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">R</span><span>rahgir<span class="brand-dot">.</span></span></a><span class="service-pill">READ-ONLY ITINERARY</span></header><main class="section-shell" style="padding:70px 0;max-width:900px"><div class="eyebrow">SHARED JOURNEY</div><h1 id="title" style="font:500 44px 'Playfair Display'">Opening shared itinerary…</h1><p id="status" style="color:#7b8580">Validating secure share link.</p><div id="content"></div></main><script>
(async()=>{const token=location.pathname.split('/').filter(Boolean).pop();const status=document.getElementById('status');try{const r=await fetch('/api/v1/shared/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.detail||'This link is invalid or revoked.');const x=d.result;document.getElementById('title').textContent=d.origin+' → '+d.destination;status.textContent='Read-only itinerary · '+new Date(d.created_at).toLocaleString()+' · Mode: '+x.mode;const alt=x.selected_alternative||{};const box=document.createElement('div');box.className='itinerary-main';box.style.marginTop='28px';const h=document.createElement('h2');h.textContent=alt.label||'Journey';box.appendChild(h);const metrics=document.createElement('p');metrics.textContent=`${x.route.distance_km} km · ${Math.round(x.route.duration_minutes)} min drive · ${(alt.stops||[]).length} stops`;box.appendChild(metrics);(alt.stops||[]).forEach((s,i)=>{const p=document.createElement('p');p.textContent=`${i+1}. ${s.name} · ${s.category} · opening-hours status: ${s.hours_status}`;box.appendChild(p)});const safety=document.createElement('p');safety.textContent='Safety: Insufficient safety data. No safety guarantee is provided.';box.appendChild(safety);if(x.mode==='synthetic_demo'){const warn=document.createElement('p');warn.textContent='DEMO ONLY — synthetic route geometry and POIs; not for navigation, field validation or research results.';warn.style.color='#a65b26';box.appendChild(warn)}document.getElementById('content').appendChild(box)}catch(e){document.getElementById('title').textContent='This itinerary is unavailable';status.textContent=e.message}})();
</script></body></html>
